<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { width:270px; margin:0; padding:14px; font:13px system-ui,sans-serif; background:#fff; color:#1b1b22; }
  @media (prefers-color-scheme: dark) { body { background:#1c1c24; color:#ececf2; } }
  h1 { font-size:15px; margin:0 0 10px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; opacity:.6; margin:14px 0 4px; }
  label { display:flex; justify-content:space-between; margin:8px 0 2px; font-size:12px; }
  label span { font-variant-numeric:tabular-nums; opacity:.8; }
  select, input[type=range] { width:100%; accent-color:#5b5bd6; } select { padding:4px; }
  .row { display:flex; justify-content:space-between; align-items:center; font-weight:600; }
  button { margin-top:12px; width:100%; padding:6px; border-radius:6px; border:1px solid #8884; background:transparent; color:inherit; cursor:pointer; }
  p { font-size:11px; opacity:.6; margin:10px 0 0; }
</style></head><body>
  <h1>Song Enhancer Hi-Fi</h1>
  <div class="row"><span>Enhancement</span><input type="checkbox" id="enabled"></div>
  <h2>Mode</h2>
  <select id="preset">
    <option value="auto">Auto Enhance (adaptive)</option>
    <option value="hifi">Hi-Fi Studio</option>
    <option value="bass">Bass Boost</option>
    <option value="vocal">Vocal Clarity</option>
    <option value="warm">Warm Vintage</option>
    <option value="loud">Loud &amp; Punchy</option>
  </select>
  <div id="sliders"></div>
  <button id="reset">Reset my sliders</button>
  <p>Works on YouTube Music and YouTube. Reload the tab after installing.</p>
  <script src="popup.js"></script>
</body></html>
